name: Execute Preprod Interactions
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/interact.yml'
      - 'preprod-deployment/cli/src/launcher/execute-interactions.ts'

jobs:
  interact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd preprod-deployment
          npm install
          npm install --no-save tsx
          node infra/scripts/patch-wallet-sdk.mjs

      - name: Copy Contract
        run: |
          cp contracts/compact/invoice_flow.compact preprod-deployment/contracts/src/bboard.compact

      - name: Compile Contract
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0
          compact --version
          cd preprod-deployment/contracts
          compact compile src/bboard.compact ./src/managed/bboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build Contract Bindings
        run: |
          cd preprod-deployment/contracts
          npm run build
          
      - name: Increase swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /swapfile_extra || true
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Execute 52 On-Chain ZK Interactions
        run: |
          cd preprod-deployment/cli
          npx tsx src/launcher/execute-interactions.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
          WALLET_SEED: ${{ secrets.WALLET_SEED || 'a669546dc647c8799538446cfa46bf22db943fde032f1a696ef4f1466d443d29' }}

      - name: Commit and Push PREPROD_USERS.md
        run: |
          git config --global user.name "rishi3243kumar"
          git config --global user.email "rishigshshshsh@gmail.com"
          git add PREPROD_USERS.md
          git commit -m "docs: add 52 on-chain ZK verification transaction receipts from Midnight Preprod" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Verification Receipts Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-users-receipts
          path: PREPROD_USERS.md
